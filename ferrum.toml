[server]
host = "0.0.0.0"
port = 8080
max_connections = 10000

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
timeout_secs = 30
max_retries = 3

[providers.cerebras]
base_url = "https://api.cerebras.ai/v1"
timeout_secs = 30
max_retries = 3

[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
timeout_secs = 30
max_retries = 3

[providers.anthropic]
base_url = "https://api.anthropic.com/v1"
timeout_secs = 60
max_retries = 2
header_style = "anthropic"

[providers.openai]
base_url = "https://api.openai.com/v1"
timeout_secs = 60
max_retries = 3

[rate_limit]
requests_per_minute = 1000
window_secs = 60

[metrics]
enabled = true
path = "/metrics"

[fallback]
enabled = true
default_fallback_model = "gemini/gemini-2.0-flash"
max_attempts = 3
backoff_ms = 500
